<!DOCTYPE html>
<html lang="es">

<head>

    <!-- =====================================================
         CONFIGURACIÓN BÁSICA
         ===================================================== -->

    <meta charset="UTF-8">

    <!--
        Hace que la página utilice correctamente
        el ancho del dispositivo.

        Esto es MUY importante para celulares.
    -->
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">


    <!-- =====================================================
         INFORMACIÓN DE LA PÁGINA
         ===================================================== -->

    <title>Para ti ❤️</title>

    <meta
        name="description"
        content="Una pequeña sorpresa hecha con mucho amor ❤️"
    >


    <!-- =====================================================
         CSS
         ===================================================== -->

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>

    <!-- =====================================================
         FONDO
         ===================================================== -->

    <div id="background"></div>


    <!-- =====================================================
         PANTALLA DE INICIO
         ===================================================== -->

    <section
        id="intro"
        aria-label="Mensaje inicial"
    >

        <!-- Corazón principal -->

        <div
            class="heart"
            aria-hidden="true"
        >
            ❤️
        </div>


        <!-- Título -->

        <h1>
            Para ti, mi amor
        </h1>


        <!-- Descripción -->

        <p>
            Hay algo que quiero decirte...
        </p>


        <!-- Botón -->

        <button
            id="startButton"
            type="button"
        >
            Toca aquí ❤️
        </button>

    </section>


    <!-- =====================================================
         CONTENEDOR DE LA EXPERIENCIA
         ===================================================== -->

    <main
        id="love-container"
        aria-label="Mensajes de amor"
    >
    </main>


    <!-- =====================================================
         MENSAJE FINAL
         ===================================================== -->

    <section
        id="final-message"
        aria-label="Mensaje final"
    >

        <h1>
            I LOVE YOU ❤️
        </h1>

        <p>
            Te amo.
        </p>

    </section>


    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script
        src="js/script.js"
        defer
    ></script>

</body>

</html>
